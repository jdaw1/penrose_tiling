<svg width='960' height='1008.4204' viewBox='-1.570091769 -1.649283989 3.140183537 3.298567977' preserveAspectRatio='xMidYMid meet' id='Penrose_Rhombi_00' xmlns='http://www.w3.org/2000/svg'>
