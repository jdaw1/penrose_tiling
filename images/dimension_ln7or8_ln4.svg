<svg width='256' height='256' viewBox='0 0 1 1' id='Sierpinski_gasket_4by4' xmlns='http://www.w3.org/2000/svg'>
<!-- From https://github.com/jdaw1/penrose_tiling/blob/main/images/dimension_ln7or8_ln4.svg -->
<style>
	.on-off {animation: toggleOpacity 5s infinite steps(1);} <!-- time is whole-loop time; steps(1) switches instantly -->
	@keyframes toggleOpacity { 0% {opacity: 0;}   50% {opacity: 1;}   100% {opacity: 0;} }
</style>
<defs>
	<g id='d_1' transform='scale(0.25)'>  <!-- 4 by 4,  8 squares -->
		<path fill='#000' stroke='none' d='M0 0H1V3H4V4H0Z'/>
		<path fill='#000' stroke='none' d='M2 2V3.5H0.5V2Z' class='on-off'/>  <!-- Overlapping so no bleed-through gaps -->
	</g>
	<g id='d_2' transform='scale(0.25)'>  <!-- 16 by 16,  64 squares -->
		<use href='#d_1'/>
		<use href='#d_1'  transform='translate(0,1)'/>
		<use href='#d_1'  transform='translate(0,2)'/>
		<use href='#d_1'  transform='translate(0,3)'/>
		<use href='#d_1'  transform='translate(1,3)'/>
		<use href='#d_1'  transform='translate(2,3)'/>
		<use href='#d_1'  transform='translate(3,3)'/>
		<use href='#d_1'  transform='translate(1,2)' class='on-off'/>
	</g>
	<g id='d_3' transform='scale(0.25)'>  <!-- 64 by 64,  512 squares -->
		<use href='#d_2'/>
		<use href='#d_2'  transform='translate(0,1)'/>
		<use href='#d_2'  transform='translate(0,2)'/>
		<use href='#d_2'  transform='translate(0,3)'/>
		<use href='#d_2'  transform='translate(1,3)'/>
		<use href='#d_2'  transform='translate(2,3)'/>
		<use href='#d_2'  transform='translate(3,3)'/>
		<use href='#d_2'  transform='translate(1,2)' class='on-off'/>
	</g>
	<g id='d_4' transform='scale(0.25)'>  <!-- 256 by 256,  4096 squares -->
		<use href='#d_3'/>
		<use href='#d_3'  transform='translate(0,1)'/>
		<use href='#d_3'  transform='translate(0,2)'/>
		<use href='#d_3'  transform='translate(0,3)'/>
		<use href='#d_3'  transform='translate(1,3)'/>
		<use href='#d_3'  transform='translate(2,3)'/>
		<use href='#d_3'  transform='translate(3,3)'/>
		<use href='#d_3'  transform='translate(1,2)' class='on-off'/>
	</g>
	<g id='d_5' transform='scale(0.25)'>  <!-- 1024 by 1024,  32768 squares -->
		<use href='#d_4'/>
		<use href='#d_4'  transform='translate(0,1)'/>
		<use href='#d_4'  transform='translate(0,2)'/>
		<use href='#d_4'  transform='translate(0,3)'/>
		<use href='#d_4'  transform='translate(1,3)'/>
		<use href='#d_4'  transform='translate(2,3)'/>
		<use href='#d_4'  transform='translate(3,3)'/>
		<use href='#d_4'  transform='translate(1,2)' class='on-off'/>
	</g>
</defs>
<use href='#d_5'/>
</svg>
