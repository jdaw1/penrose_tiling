<!-- EdgeLength = 2 -->
<!-- Browser fail for large SVG? Bug report at https://issues.chromium.org/issues/390969197 -->

<g transform='scale(1,-1)'> <!-- PostScript and Excel positive y goes up the page, SVG it goes down. This reflection makes SVG behave as PostScript and Excel. -->

<!-- This path traces the outside of the rhombi, intended to be fill'able as a background colour to the arcs. -->
<!-- The viewBox is almost tight to the arcs, but is a slight subset of the rhombi. -->
<!-- If, as default, filling this path with a neutral background colour, e.g. white, it works as-is. -->
<!-- But if manually editing so that path stroke'd, or fill'd dramatically, then slightly enlarge the viewBox. -->
<!-- Enlargement amount depends on whether vector-effect='non-scaling-stroke', on stroke-width, and slightly on stroke-linejoin. -->
<path fill='#FFF'  stroke='none' vector-effect='non-scaling-stroke' stroke-width='2px' stroke-linejoin='round'  d='
	M 2 0
	L 2.618033989 1.902113033
	1 3.077683537
	0.381966011 4.97979657
	-1.618033989 4.97979657
	-2.236067977 3.077683537
	-3.854101966 1.902113033
	-3.236067977 0
	-3.854101966 -1.902113033
	-2.236067977 -3.077683537
	-1.618033989 -4.97979657
	0.381966011 -4.97979657
	1 -3.077683537
	2.618033989 -1.902113033
Z'/> <!-- Outside of tiling of rhombi. -->

<g transform='scale(1)'> <!-- edgeLength/2, so that all arc radii are precisely 1, lessening file size -->

<style>
	.sf {stroke: #000;  stroke-width: 0.1;  paint-order: fill stroke markers;} <!-- sf = stroke's formatting -->
	.c5r_o  {fill: #FFF;}
	.c5p_o  {fill: #FFF;}
	.c15_o  {fill: #FFF;}
	.c25_o  {fill: #FFF;}
	.c55_o  {fill: #FFF;}
