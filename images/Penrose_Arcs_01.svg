	.c15_e  {fill: #B30000;} <!-- Dark red -->
	.c25_e  {fill: #0F0;} <!-- Green -->
	.c55_e  {fill: #FC0;} <!-- Yellow-gold -->
	.c105_e {fill: #4DFFFF;} <!-- Light cyan -->
	.c215_e {fill: #B3A1B3;} <!-- Grey-grey-red -->
	.cBig   {fill: #FFF;}
</style>

