<svg width='960' height='913.4865' viewBox='-3.108933537 -2.958300983 6.217867074 5.916601966' preserveAspectRatio='xMidYMid meet' id='Penrose_Rhombi_01' xmlns='http://www.w3.org/2000/svg'>
<!-- TilingId = 1;  NumFats = 20;  NumThins = 10;  ==> #tiles= 30;  NumPathsClosed = 1;  NumPathsOpen = 5;  BoundingPathNumVertices = 20 -->
<!-- Licence = "GNU General Public License, Version 3, 29 June 2007"; URL = "https://github.com/jdaw1/penrose_tiling/"; Author = "Julian D. A. Wiseman of www.jdawiseman.com". -->
<!-- EdgeLength = 1; stroke-width defined to be EdgeLength / 9.8885. If changing stroke-width, need to alter viewBox, for which it might help to know that, without line, and assuming inclusion of all the C-generated rhombi, values would be -3.0777 -2.9271 6.1554 5.8541. -->
<!-- Browser fail for large SVG? Bug report at https://issues.chromium.org/issues/390969197 -->
<g transform='scale(1,-1)'> <!-- PostScript and Excel positive y goes up the page, SVG it goes down. This reflection makes SVG behave as the others. -->

<defs>
	<g id='t'> <!-- thin -->
		<path d='M 0 0   L -0.30901699437495 0.95105651629515   -0.61803398874989 0   -0.30901699437495 -0.95105651629515  Z'/> <!-- thin -->
		<!-- <circle fill='#000' cx='-0.15' cy='0' r='0.0625'/> -->  <!-- north-corner circle, de-comment to show -->
	</g> <!-- thin -->
	<g id='f'>
		<path d='M 0 0   L -0.80901699437495 0.58778525229247   -1.61803398874989 0   -0.80901699437495 -0.58778525229247  Z'/> <!-- fat (closed paths) -->
		<!-- <circle fill='#3CC' stroke='#C00' stroke-width='0.0625' paint-order='stroke fill' cx='-0.3' cy='0' r='0.075'/> -->  <!-- north-corner circle, de-comment to show -->
	</g> <!-- fat in closed path -->
	<g id='o'>
		<path d='M 0 0   L -0.80901699437495 0.58778525229247   -1.61803398874989 0   -0.80901699437495 -0.58778525229247  Z'/> <!-- fat in open path, for editability separated from fat-in-closed -->
		<!-- <circle fill='#000' stroke='#FFF' stroke-width='0.0625' paint-order='stroke fill' cx='-0.3' cy='0' r='0.075'/> -->  <!-- north-corner circle, de-comment to show -->
		<!-- <circle stroke='#000' fill='#6F6' opacity='1' cx='-0.809016994' r='0.1667'/> --> <!-- To locate holes, and some other debugging: de-comment to show. -->
	</g> <!-- fat in open path -->
	<g id='c5p'>
		<g fill='#9F9' opacity='1'>  <!-- Fats, closed PathLength=5 pointy: light green -->
			<use href='#f'  transform='rotate(270)'/>
			<use href='#f'  transform='rotate(198)'/>
			<use href='#f'  transform='rotate(126)'/>
			<use href='#f'  transform='rotate(54)'/>
			<use href='#f'  transform='rotate(342)'/>
		</g>  <!-- fill='#9F9' -->
	</g>  <!-- id='c5p' -->
</defs>

<g stroke-width='0.0625' stroke='#000' paint-order='fill stroke' stroke-linejoin='round' stroke-opacity='1'>  <!-- all rhombi -->

<g fill='#CCC' opacity='1'>  <!-- thins not otherwise inside a path. -->
	<use href='#t'  transform='translate(0.5878,-1.809) rotate(234)'/>
	<use href='#t'  transform='translate(-0.5878,-1.809) rotate(306)'/>
	<use href='#t'  transform='translate(1.5388,-1.118) rotate(18)'/>
	<use href='#t'  transform='translate(-1.5388,-1.118) rotate(162)'/>
	<use href='#t'  transform='translate(1.9021) rotate(306)'/>
	<use href='#t'  transform='translate(-1.9021) rotate(234)'/>
	<use href='#t'  transform='translate(1.5388,1.118) rotate(90)'/>
	<use href='#t'  transform='translate(-1.5388,1.118) rotate(90)'/>
	<use href='#t'  transform='translate(0.5878,1.809) rotate(18)'/>
	<use href='#t'  transform='translate(-0.5878,1.809) rotate(162)'/>
</g>  <!-- thins not otherwise inside a path -->


<!-- Paint open paths -->

<g fill='#333' opacity='1' stroke='#000'>  <!-- Fats, open, PathLength=3: dark grey, to give whole tiling appearance of a serrated edge -->
<!-- <animate attributeName='fill' attributeType='XML' values='#333;#FFF' keyTimes='0;0.8' dur='10s' begin='0s' calcMode='discrete' repeatCount='indefinite'/> -->
	<use href='#o'  transform='translate(-1.5388,-2.118) rotate(162)'/> <!-- 1,7,2 -->
	<use href='#o'  transform='translate(0,-1) rotate(90)'/>
	<use href='#o'  transform='translate(1.5388,-2.118) rotate(18)'/>
	<use href='#o'  transform='translate(-1.5388,-2.118) rotate(306)'/> <!-- 2,10,2 -->
	<use href='#o'  transform='translate(-0.9511,-0.309) rotate(18)'/>
	<use href='#o'  transform='translate(-2.4899,0.809) rotate(90)'/>
	<use href='#o'  transform='translate(1.5388,-2.118) rotate(234)'/> <!-- 3,13,2 -->
	<use href='#o'  transform='translate(0.9511,-0.309) rotate(162)'/>
	<use href='#o'  transform='translate(2.4899,0.809) rotate(90)'/>
	<use href='#o'  transform='translate(-2.4899,0.809) rotate(234)'/> <!-- 4,16,2 -->
	<use href='#o'  transform='translate(-0.5878,0.809) rotate(306)'/>
	<use href='#o'  transform='translate(0,2.618) rotate(18)'/>
	<use href='#o'  transform='translate(2.4899,0.809) rotate(306)'/> <!-- 5,19,2 -->
	<use href='#o'  transform='translate(0.5878,0.809) rotate(234)'/>
	<use href='#o'  transform='translate(0,2.618) rotate(162)'/>
</g>  <!-- Fats, open, PathLength=3. Comments, at only start of contiguous part of a path, are: pathId,rhID,withinPathNum -->


<!-- Paint closed paths not otherwise inside a larger path. Comment is pathId. -->

	<use href='#c5p'/> <!-- 0 -->

<!-- To show circle within which paths the few open paths are long, decomment next four lines. -->
